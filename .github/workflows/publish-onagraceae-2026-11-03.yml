name: Publish source-verified original Onagraceae photos
on:
  push:
    branches: [main]
    paths:
      - 'photo-intake/remote-photo-manifests/onagraceae-2026-11-03.json'
      - 'scripts/publish_verified_onagraceae_zip.py'
      - '.github/workflows/publish-onagraceae-2026-11-03.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: family-photo-first-onagraceae-release
  cancel-in-progress: false
jobs:
  release-source-cleared-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install image validation dependency
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Verify photo-specific license, live source taxon and original Onagraceae ZIP image SHA256
        run: |
          python3 scripts/publish_verified_onagraceae_zip.py \
            --manifest photo-intake/remote-photo-manifests/onagraceae-2026-11-03.json \
            --source-root "$RUNNER_TEMP/source-cleared" \
            --report "$RUNNER_TEMP/onagraceae-source-audit.json"
      - name: Install source-cleared photos, original photographer credits and species gallery indexes
        run: |
          python3 scripts/publish_approved_family_photos.py --source-root "$RUNNER_TEMP/source-cleared" --site-root site --check
          python3 scripts/publish_approved_family_photos.py --source-root "$RUNNER_TEMP/source-cleared" --site-root site
          python3 scripts/verify_automatic_gallery.py --site-root site
          python3 scripts/build_collection_preview.py
      - name: Commit exact original images and credits to correct public family site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/media site/data/species site/data/collection-index.json site/data/gallery-index.json
          if git diff --cached --quiet; then
            echo "No new eligible originals; consult source audit for existing photos or holds."
          else
            git diff --cached --check
            git commit -m "Publish credited original Onagraceae photographs"
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then
                echo "Published photo release committed."
                break
              fi
              if test "$attempt" -eq 4; then
                echo "Unable to publish after four non-force retries" >&2
                exit 1
              fi
              # Re-apply verified originals on the NEW head: never rebase conflicting gallery indexes.
              git fetch origin main
              git reset --hard origin/main
              python3 scripts/publish_approved_family_photos.py --source-root "$RUNNER_TEMP/source-cleared" --site-root site --check
              python3 scripts/publish_approved_family_photos.py --source-root "$RUNNER_TEMP/source-cleared" --site-root site
              python3 scripts/verify_automatic_gallery.py --site-root site
              python3 scripts/build_collection_preview.py
              git add site/media site/data/species site/data/collection-index.json site/data/gallery-index.json
              if git diff --cached --quiet; then
                echo "All source-cleared originals were already published by a concurrent job."
                exit 0
              fi
              git diff --cached --check
              git commit -m "Apply approved Onagraceae originals over refreshed gallery indexes"
            done
          fi
      - name: Preserve photo-specific source audit and holds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onagraceae-photo-source-audit
          path: "${{ runner.temp }}/onagraceae-source-audit.json"
          retention-days: 30
          if-no-files-found: warn
