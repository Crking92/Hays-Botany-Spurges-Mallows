name: Verify existing Spurges-Mallows public gallery and site bytes
on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify_existing_site.py'
      - 'site/data/gallery-index.json'
      - '.github/workflows/verify-existing-site-gallery.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit existing public records and photo blob hashes
        run: python3 scripts/verify_existing_site.py
      - name: Verify deployed gallery reaches current GitHub counts
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          from pathlib import Path
          expected=json.loads(Path("site/data/gallery-index.json").read_text())["photo_count"]
          url="https://crking92.github.io/Hays-Botany-Spurges-Mallows/site/data/gallery-index.json"
          for attempt in range(30):
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"HaysBotanyGalleryDeploymentQA/1.0"})
                  with urllib.request.urlopen(req,timeout=15) as r:
                      actual=json.load(r).get("photo_count")
                  if actual==expected:
                      print("PAGES_GALLERY_COUNT_MATCH",expected,flush=True)
                      break
                  print("Pages count pending",actual,"expected",expected,flush=True)
              except Exception as e: print("Pages pending",str(e)[:160],flush=True)
              time.sleep(10)
          else: raise SystemExit("Pages has not deployed current gallery count")
          PY
      - name: Verify published species JSON and every gallery image at live URL
        run: python3 scripts/verify_existing_site.py --live https://crking92.github.io/Hays-Botany-Spurges-Mallows/site/
