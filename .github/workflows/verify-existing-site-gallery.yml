name: Verify existing Spurges-Mallows public gallery and site bytes
on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify_existing_site.py'
      - 'site/data/gallery-index.json'
      - 'site/data/species/**'
      - '.github/workflows/verify-existing-site-gallery.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit existing public records and photo blob hashes
        run: python3 scripts/verify_existing_site.py
      - name: Wait for exact changed species cards and gallery index on Pages
        run: |
          python3 - <<'PY'
          import json, subprocess, time, urllib.request
          from pathlib import Path
          base="https://crking92.github.io/Hays-Botany-Spurges-Mallows/site/"
          changed=subprocess.check_output(["git","diff-tree","--no-commit-id","--name-only","-r","HEAD"],text=True).splitlines()
          targets=[p for p in changed if p.startswith("site/data/species/") and p.endswith(".json")]
          targets.append("site/data/gallery-index.json")
          for attempt in range(30):
              pending=[]
              for p in targets:
                  try:
                      req=urllib.request.Request(base+p.removeprefix("site/")+"?qa_attempt="+str(attempt),headers={"User-Agent":"HaysBotanyGalleryDeploymentQA/1.0","Cache-Control":"no-cache"})
                      with urllib.request.urlopen(req,timeout=15) as response:
                          actual=response.read()
                      expected=Path(p).read_bytes()
                      if actual!=expected: pending.append(p+" (bytes differ)")
                  except Exception as e:
                      pending.append(p+" ("+str(e)[:120]+")")
              if not pending:
                  print("PAGES_CHANGED_FILES_BYTE_MATCH",len(targets),flush=True)
                  break
              print("Pages pending:",", ".join(pending),flush=True)
              time.sleep(10)
          else:
              raise SystemExit("Pages has not deployed exact changed species card/index bytes")
          PY
      - name: Verify published species JSON and every gallery image at live URL
        run: python3 scripts/verify_existing_site.py --live https://crking92.github.io/Hays-Botany-Spurges-Mallows/site/
